<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c12">
<title>Home Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
<style>
:root{
  --accent:#7c5cff; --bg:#080a10; --card:rgba(255,255,255,.045); --card-h:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.08); --txt:#eef0f6; --mut:#8b90a3; --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  --glow:var(--accent);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:var(--bg);
  background-image:
    radial-gradient(900px 500px at 10% -10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 60%),
    radial-gradient(700px 500px at 100% 0%,rgba(56,189,248,.12),transparent 60%),
    radial-gradient(800px 600px at 50% 120%,rgba(236,72,153,.10),transparent 60%);
  background-attachment:fixed;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:1500px;margin:0 auto;padding:28px clamp(16px,3vw,40px) 90px}

/* Header */
header{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.hello small{display:block;color:var(--mut);font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.hello h1{margin:4px 0 0;font-size:clamp(26px,4vw,40px);font-weight:700;letter-spacing:-.02em}
.hello h1 span{background:linear-gradient(90deg,var(--accent),#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}
.clock{font-variant-numeric:tabular-nums;font-size:clamp(34px,5vw,56px);font-weight:200;letter-spacing:-.02em;text-align:right;line-height:1}
.clock small{display:block;font-size:14px;font-weight:400;color:var(--mut);margin-top:6px;letter-spacing:0}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:30px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(14px);font-size:13.5px;color:var(--mut)}
.chip b{color:var(--txt);font-weight:600}
.chip i{font-size:17px;color:var(--accent)}
.sp{flex:1}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mut);box-shadow:0 0 0 0 transparent}
.online .dot{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.connecting .dot{background:var(--warn);animation:pulse 1s infinite}
.error .dot{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13.5px;transition:.2s}
.btn:hover{background:var(--card-h)}
.btn.primary{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#38bdf8));border-color:transparent;font-weight:600}
.btn.active{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}

/* Sections & grid */
section{margin-bottom:34px}
section h2{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
section h2 i{font-size:18px;color:var(--accent)}
section h2 em{font-style:normal;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:14px}
.grid.cams{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}

.tile{position:relative;padding:16px;border-radius:22px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(16px);
  transition:transform .2s,background .25s,border-color .25s,box-shadow .3s;min-height:128px;display:flex;flex-direction:column;gap:10px;user-select:none;overflow:hidden}
.tile:hover{background:var(--card-h);transform:translateY(-2px)}
.tile.tg{cursor:pointer}
.tile.on{border-color:color-mix(in srgb,var(--glow) 55%,transparent);
  background:linear-gradient(160deg,color-mix(in srgb,var(--glow) 24%,transparent),var(--card) 70%);
  box-shadow:0 8px 40px -12px color-mix(in srgb,var(--glow) 60%,transparent)}
.tile.off{opacity:.55}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:23px;background:rgba(255,255,255,.06);color:var(--mut);transition:.25s;flex:none}
.on .ico{background:var(--glow);color:#0b0d14;box-shadow:0 0 22px -2px var(--glow)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.nm{font-size:14px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.st{font-size:12.5px;color:var(--mut);margin-top:3px}
.on .st{color:color-mix(in srgb,var(--txt) 75%,var(--glow))}
.val{font-size:30px;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:auto}
.val small{font-size:14px;color:var(--mut);margin-left:3px}
.tile.sens .ico{color:var(--accent)}
.tile.alert{border-color:color-mix(in srgb,var(--warn) 60%,transparent)}
.tile.alert .ico{background:var(--warn);color:#111}

.sw{width:44px;height:26px;border-radius:99px;background:rgba(255,255,255,.12);position:relative;flex:none;transition:.25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.25s}
.on .sw{background:var(--glow)}
.on .sw::after{left:21px}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:99px;background:rgba(255,255,255,.12);outline:none;margin:4px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.5);cursor:pointer}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:#fff}

.ctl{display:flex;gap:8px;align-items:center}
.rb{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.07);display:grid;place-items:center;font-size:20px;transition:.15s}
.rb:hover{background:rgba(255,255,255,.14)}
.rb:active{transform:scale(.92)}
.rb.big{flex:1;width:auto;gap:8px;font-size:14px;font-weight:600;display:flex;justify-content:center}
.ctl .t{flex:1;text-align:center;font-size:26px;font-weight:300;font-variant-numeric:tabular-nums}

.cam{padding:0;min-height:0}
.cam .view{position:relative;aspect-ratio:16/9;background:#000 center/cover;overflow:hidden}
.cam img{width:100%;height:100%;object-fit:cover;display:block}
.cam .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 28%,transparent 65%,rgba(0,0,0,.65));pointer-events:none}
.cam .top,.cam .bot{position:absolute;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.cam .top{top:12px}.cam .bot{bottom:12px}
.rec{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.1em;background:rgba(0,0,0,.45);padding:4px 9px;border-radius:99px;backdrop-filter:blur(8px)}
.rec::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--bad);animation:pulse 1.4s infinite}
.rec.live::before{background:var(--ok)}
.cam .acts{display:flex;gap:8px}
.cam .acts .rb{width:34px;height:34px;font-size:18px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px)}

.mp .meta{margin-top:auto}
.empty{padding:50px 20px;border:1.5px dashed var(--line);border-radius:24px;text-align:center;color:var(--mut)}
.empty h3{color:var(--txt);margin:0 0 8px;font-size:20px}
.empty .btn{margin:6px 4px}

/* Edit mode */
.ed{display:none;position:absolute;top:8px;right:8px;gap:6px;z-index:3}
body.edit .ed{display:flex}
.ed button{width:28px;height:28px;border-radius:9px;background:rgba(0,0,0,.65);display:grid;place-items:center;font-size:15px;backdrop-filter:blur(6px)}
.ed button:hover{background:var(--bad)}
.ed button.rn:hover{background:var(--accent)}
body.edit .tile{animation:wob .35s ease-in-out infinite alternate;cursor:grab}
@keyframes wob{from{transform:rotate(-.35deg)}to{transform:rotate(.35deg)}}
.tile.dragover{outline:2px dashed var(--accent);outline-offset:3px}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(3,4,8,.7);backdrop-filter:blur(8px);display:none;place-items:center;z-index:50;padding:16px}
.modal.open{display:grid}
.box{width:min(640px,100%);max-height:88vh;overflow:auto;background:#10131c;border:1px solid var(--line);border-radius:26px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.box h3{margin:0 0 4px;font-size:20px}.box p{margin:0 0 18px;color:var(--mut);font-size:13.5px;line-height:1.5}
.box label{display:block;font-size:12px;color:var(--mut);margin:14px 0 6px;letter-spacing:.06em;text-transform:uppercase}
.box input[type=text],.box input[type=password],.box input[type=search]{width:100%;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);outline:none}
.box input:focus{border-color:var(--accent)}
.acts2{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.sw-acc{display:flex;gap:10px}
.sw-acc button{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
.sw-acc button.sel{border-color:#fff}
.list{margin-top:12px;max-height:46vh;overflow:auto;display:grid;gap:6px}
.it{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid transparent;cursor:pointer;text-align:left;width:100%}
.it:hover{background:rgba(255,255,255,.07)}
.it.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.it i{font-size:20px;color:var(--accent)}
.it .n{font-size:14px}.it .e{font-size:11.5px;color:var(--mut)}
.it .ck{margin-left:auto;color:var(--accent);font-size:20px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.filters button{padding:5px 11px;border-radius:99px;font-size:12px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.filters button.sel{background:var(--accent);border-color:transparent}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1b1f2c;border:1px solid var(--line);padding:11px 18px;border-radius:14px;font-size:13.5px;z-index:99;opacity:0;pointer-events:none;transition:.3s}
.toast.show{opacity:1}
/* Navigation & Seiten */
nav{display:flex;gap:6px;margin:0 0 22px;padding:5px;border-radius:16px;background:var(--card);border:1px solid var(--line);width:max-content;max-width:100%;overflow:auto;backdrop-filter:blur(14px)}
nav button{padding:9px 16px;border-radius:12px;font-size:14px;color:var(--mut);display:flex;gap:8px;align-items:center;white-space:nowrap;transition:.2s}
nav button:hover{color:var(--txt)}
nav button.on{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#38bdf8));color:#fff;font-weight:600}
nav button.alarm-on i{color:var(--bad)}
.page{display:none}.page.show{display:block}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;padding:4px;border-radius:13px;background:var(--card);border:1px solid var(--line)}
.seg button{padding:7px 12px;border-radius:10px;font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center}
.seg button.on{background:rgba(255,255,255,.12);color:var(--txt)}
.card{padding:20px;border-radius:24px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(16px)}
.card h4{margin:0 0 12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600}
.edtool{display:none}body.edit .edtool{display:inline-flex}

/* Multiview */
.mv{display:grid;gap:12px}
.mv .cell{position:relative;border-radius:20px;overflow:hidden;background:#05060a;border:1px solid var(--line);aspect-ratio:16/9;cursor:pointer;transition:.2s}
.mv .cell:hover{border-color:var(--accent)}
.mv .cell img{width:100%;height:100%;object-fit:cover;display:block}
.mv .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5),transparent 25%,transparent 65%,rgba(0,0,0,.7));pointer-events:none}
.mv .lbl{position:absolute;left:12px;right:12px;bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.mv select{max-width:45%;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.15);border-radius:9px;padding:4px 6px;font-size:12px;backdrop-filter:blur(8px)}
.mv select option{background:#10131c}
.mv .nocam{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;color:var(--mut);opacity:.4}
.mv .cell .rec{position:absolute;top:10px;left:10px}
.mv .cell .lv{position:absolute;top:8px;right:8px;width:30px;height:30px;font-size:16px;background:rgba(0,0,0,.5)}
.mv.l1p5 .cell:first-child{grid-column:span 2;grid-row:span 2}
.bigview{aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden}
.bigview img{width:100%;height:100%;object-fit:contain}

/* Energie */
.egrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
.estack{display:grid;gap:16px;align-content:start}
.k2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.flow{width:100%;height:auto;display:block}
.fl{fill:none;stroke:rgba(255,255,255,.09);stroke-width:4;stroke-linecap:round}
.fa{fill:none;stroke-linecap:round;stroke-dasharray:2 14;animation:dash 1.5s linear infinite}
.fa.rev{animation-direction:reverse}.fa.idle{opacity:0;animation:none}
@keyframes dash{to{stroke-dashoffset:-32}}
.ndw{width:220px;height:220px;display:grid;place-items:center;overflow:visible}
.nd{position:relative;width:140px;height:140px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--c) 34%,#10131c),#0b0e15 75%);border:2px solid color-mix(in srgb,var(--c) 75%,transparent);
  box-shadow:0 0 var(--gs,24px) 2px color-mix(in srgb,var(--c) 55%,transparent),inset 0 0 26px -6px var(--c);transition:box-shadow .8s}
.nd::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--c);opacity:0;animation:ndring 3s ease-out infinite;pointer-events:none}
.nd.idle::after{animation:none}.nd.idle{box-shadow:0 0 10px 0 color-mix(in srgb,var(--c) 25%,transparent);opacity:.7}
@keyframes ndring{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.4);opacity:0}}
.nd.spin i{animation:spin 16s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.nd i{filter:drop-shadow(0 0 8px var(--c))}
.flowcard{overflow:visible}
#e-bats .ring{width:96px;height:96px}#e-bats .ring .c b{font-size:21px}#e-bats .cap{font-size:11.5px}
.ring svg,.ring{overflow:visible}.ring .fg{filter:drop-shadow(0 0 6px rgba(255,255,255,.3))}
.nd i{font-size:30px;color:var(--c)}.nd b{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}.nd small{font-size:12px;color:var(--mut)}
.elab{fill:var(--txt);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.bigv{font-size:34px;font-weight:300;letter-spacing:-.02em}
.ring{position:relative;width:128px;height:128px;margin:0 auto}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring .bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:11}
.ring .fg{fill:none;stroke-width:11;stroke-linecap:round;transition:stroke-dasharray .8s,stroke .8s}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-size:28px;font-weight:300}.ring .c small{color:var(--mut);font-size:11px}
.cap{text-align:center;color:var(--mut);font-size:12.5px;margin-top:8px}
.chart text{fill:var(--mut);font-size:11px}
.leg{display:flex;gap:16px;font-size:12.5px;color:var(--mut)}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}

/* Räume */
.planwrap{overflow:hidden;border-radius:26px;perspective:1800px;padding:6px}
.plan{position:relative;width:100%;aspect-ratio:5/3;border-radius:22px;background:rgba(255,255,255,.025) center/contain no-repeat;border:1px solid var(--line);
  transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.plan.d3{transform:rotateX(56deg) rotateZ(-34deg) scale(.7)}
.room{position:absolute;transform-style:preserve-3d;cursor:pointer}
.room .wl{position:absolute;inset:0;border:2px solid color-mix(in srgb,var(--c) 70%,#fff);border-radius:6px;display:none;background:color-mix(in srgb,var(--c) 16%,transparent);transform:translateZ(var(--z))}
.d3 .room .wl{display:block}
.room .rc{position:absolute;inset:3px;border-radius:8px;border:2px solid color-mix(in srgb,var(--c) 75%,#fff);
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 38%,rgba(10,12,18,.82)),color-mix(in srgb,var(--c) 12%,rgba(10,12,18,.88)));
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;padding:4px;overflow:hidden;text-align:center;transition:transform .9s,box-shadow .5s}
.plan.img .room .rc{background:color-mix(in srgb,var(--c) 30%,transparent);backdrop-filter:blur(2px)}
.d3 .room .rc{transform:translateZ(36px)}
.room:hover .rc{border-color:#fff}
.room.heat .rc{box-shadow:inset 0 0 26px 2px rgba(251,146,60,.55)}
.room .rn{font-size:clamp(10px,1.1vw,13px);color:color-mix(in srgb,var(--txt) 80%,var(--c));font-weight:600}
.room .rt{font-size:clamp(17px,2.6vw,32px);font-weight:300;letter-spacing:-.02em;line-height:1}
.room .rh{font-size:clamp(9px,.95vw,12px);color:var(--mut);display:flex;gap:8px;align-items:center}
.rtools{display:none;position:absolute;top:6px;right:6px;gap:4px;z-index:5}
body.edit .rtools{display:flex}.d3 .rtools,.d3 .rsz{display:none!important}
.rtools button{width:24px;height:24px;border-radius:7px;background:rgba(0,0,0,.65);display:grid;place-items:center;font-size:13px}
.rsz{display:none;position:absolute;right:2px;bottom:2px;width:20px;height:20px;cursor:nwse-resize;z-index:5;border-right:3px solid #fff;border-bottom:3px solid #fff;border-radius:0 0 8px 0}
body.edit .rsz{display:block}
body.edit .room{cursor:move}
.legbar{height:8px;border-radius:9px;background:linear-gradient(90deg,hsl(210 80% 55%),hsl(110 80% 55%),hsl(10 80% 55%));max-width:300px}
.legend{display:flex;justify-content:space-between;max-width:300px;font-size:11.5px;color:var(--mut);margin-top:4px}

/* Alarm */
.agrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px}
.ahero{text-align:center;padding:28px 20px}
.shield{width:132px;height:132px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;font-size:62px;background:rgba(255,255,255,.05);border:2px solid var(--line);color:var(--mut);transition:.4s}
.a-disarmed .shield{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 55%,transparent);box-shadow:0 0 50px -8px var(--ok)}
.a-armed .shield{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 60%,transparent);box-shadow:0 0 50px -8px var(--accent)}
.a-pending .shield{color:var(--warn);border-color:var(--warn);animation:pulse 1s infinite}
.a-triggered .shield{color:#fff;background:var(--bad);border-color:var(--bad);box-shadow:0 0 70px 0 var(--bad);animation:pulse .6s infinite}
.astate{font-size:26px;font-weight:600;margin-bottom:4px}
.amodes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.amodes button{padding:14px 6px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:13px;display:flex;flex-direction:column;gap:6px;align-items:center;transition:.2s}
.amodes button i{font-size:24px;color:var(--accent)}
.amodes button:hover{background:rgba(255,255,255,.12)}
.amodes button.dis i{color:var(--ok)}
.amodes button.cur{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,transparent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:260px;margin:14px auto 0}
.pad button{height:48px;border-radius:14px;background:rgba(255,255,255,.07);font-size:19px}
.pad button:hover{background:rgba(255,255,255,.14)}
.pcode{letter-spacing:.6em;font-size:24px;text-align:center;height:34px;color:var(--accent)}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.zn{display:flex;gap:10px;align-items:center;padding:11px 13px;border-radius:15px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:13.5px}
.zn i{font-size:21px;color:var(--ok)}.zn small{display:block;color:var(--mut);font-size:11.5px}
.zn.open{border-color:color-mix(in srgb,var(--warn) 60%,transparent)}.zn.open i{color:var(--warn)}
.zn.alert{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}.zn.alert i{color:var(--bad)}
.logl{display:grid;gap:2px;max-height:300px;overflow:auto}
.logl div{display:flex;gap:12px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px}
.logl time{color:var(--mut);font-variant-numeric:tabular-nums;min-width:62px}
@media(max-width:900px){.egrid,.agrid{grid-template-columns:1fr}}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.grid.cams{grid-template-columns:1fr}.clock{text-align:left}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hello"><small id="date"></small><h1><span id="greet">Hallo</span></h1></div>
    <div class="clock"><span id="clock">--:--</span></div>
  </header>

  <nav id="nav"></nav>

  <div class="bar">
    <div id="chips" style="display:contents"></div>
    <div class="sp"></div>
    <div class="status" id="status"><span class="dot"></span><span id="stxt">Nicht verbunden</span></div>
    <button class="btn" id="bAdd" onclick="openPicker()" style="display:none"><i class="mdi mdi-plus"></i> Kachel</button>
    <button class="btn" id="bEdit" onclick="toggleEdit()"><i class="mdi mdi-pencil-outline"></i> Bearbeiten</button>
    <button class="btn" onclick="openSettings()"><i class="mdi mdi-cog-outline"></i></button>
  </div>

  <div class="page" id="pg-home"><main id="main"></main></div>
  <div class="page" id="pg-cams"></div>
  <div class="page" id="pg-energy"></div>
  <div class="page" id="pg-rooms"></div>
  <div class="page" id="pg-alarm"></div>
</div>
<datalist id="dlEnt"></datalist>
<input type="file" id="planFile" accept="image/*" style="display:none">

<!-- Kamera-Fokus -->
<div class="modal" id="mCam" onclick="if(event.target===this)closeModals()"><div class="box" style="width:min(1100px,100%)" id="mCamBody"></div></div>
<!-- Raum ansehen -->
<div class="modal" id="mRoomView" onclick="if(event.target===this)closeModals()"><div class="box" id="mRoomBody"></div></div>
<!-- Raum bearbeiten -->
<div class="modal" id="mRoomEdit" onclick="if(event.target===this)closeModals()"><div class="box" id="mRoomEditBody"></div></div>
<!-- Energie zuordnen -->
<div class="modal" id="mEnergy" onclick="if(event.target===this)closeModals()"><div class="box" id="mEnergyBody"></div></div>
<!-- Alarm zuordnen -->
<div class="modal" id="mAlarmCfg" onclick="if(event.target===this)closeModals()"><div class="box" id="mAlarmCfgBody"></div></div>

<!-- Einstellungen -->
<div class="modal" id="mSet" onclick="if(event.target===this)closeModals()">
  <div class="box">
    <h3>Verbindung</h3>
    <p>Trage deine Home-Assistant-Adresse und einen <b>Langlebigen Zugriffstoken</b> ein (HA → Profil → Sicherheit → ganz unten). Der Token bleibt nur in deinem Browser.</p>
    <label>Home Assistant URL</label>
    <input type="text" id="iUrl" placeholder="http://homeassistant.local:8123  (leer = gleiche Adresse wie diese Seite)">
    <label>Zugriffstoken</label>
    <input type="password" id="iTok" placeholder="eyJhbGciOi…">
    <label>Akzentfarbe</label>
    <div class="sw-acc" id="accs"></div>
    <label>Wandmodus (Raspberry Pi + Monitor, ohne Bedienung)</label>
    <div id="kcfg"></div>
    <div class="acts2">
      <button class="btn primary" onclick="saveConn()"><i class="mdi mdi-lan-connect"></i> Verbinden</button>
      <button class="btn" onclick="startDemo()"><i class="mdi mdi-flask-outline"></i> Demo-Modus</button>
      <button class="btn" onclick="exportCfg()"><i class="mdi mdi-export"></i> Layout exportieren</button>
      <button class="btn" onclick="importCfg()"><i class="mdi mdi-import"></i> Importieren</button>
      <button class="btn" onclick="closeModals()">Schließen</button>
    </div>
  </div>
</div>

<!-- Picker -->
<div class="modal" id="mPick" onclick="if(event.target===this)closeModals()">
  <div class="box">
    <h3>Kachel hinzufügen</h3>
    <p>Klicke auf Entitäten, um sie ein- oder auszublenden.</p>
    <input type="search" id="pSearch" placeholder="Suchen…" oninput="renderPicker()">
    <div class="filters" id="pFilters"></div>
    <div class="list" id="pList"></div>
    <div class="acts2"><button class="btn primary" onclick="closeModals()">Fertig</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ Konfiguration ============ */
const LS='ha-dash-v1';
const DEF={url:'',token:'',demo:false,tiles:[],names:{},accent:'#7c5cff',camLayout:'auto',camSel:[],energy:{},rooms:[],plan:'',alarm:{}};
let cfg;try{cfg={...DEF,...JSON.parse(localStorage.getItem(LS)||'{}')}}catch{cfg={...DEF}}
const save=()=>localStorage.setItem(LS,JSON.stringify(cfg));
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dom=id=>id.split('.')[0];
const ACCENTS=['#7c5cff','#38bdf8','#34d399','#f59e0b','#f43f5e','#ec4899'];

/* Sektionen: Reihenfolge & Zuordnung */
const SECTIONS=[
 {id:'cam',t:'Kameras',i:'cctv',d:['camera'],grid:'cams'},
 {id:'ctl',t:'Licht & Schalter',i:'lightbulb-group-outline',d:['light','switch','input_boolean','fan','cover','lock']},
 {id:'clm',t:'Klima',i:'thermostat',d:['climate']},
 {id:'med',t:'Medien',i:'speaker-wireless',d:['media_player']},
 {id:'sen',t:'Sensoren',i:'chart-line',d:['sensor','binary_sensor','person','weather']},
 {id:'aut',t:'Automatisierungen',i:'robot-outline',d:['automation']},
 {id:'scn',t:'Szenen & Skripte',i:'palette-swatch-outline',d:['scene','script','button']},
];
const SUPPORTED=SECTIONS.flatMap(s=>s.d);
const secOf=id=>SECTIONS.find(s=>s.d.includes(dom(id)));

/* ============ Icons ============ */
const DOMICON={light:'lightbulb',switch:'toggle-switch-variant',input_boolean:'toggle-switch-outline',fan:'fan',cover:'blinds',lock:'lock',climate:'thermostat',
 media_player:'speaker',sensor:'gauge',binary_sensor:'checkbox-blank-circle-outline',person:'account',weather:'weather-partly-cloudy',automation:'robot',scene:'palette',script:'script-text-play',button:'gesture-tap-button',camera:'cctv'};
const DCICON={temperature:'thermometer',humidity:'water-percent',power:'flash',energy:'lightning-bolt',battery:'battery',illuminance:'brightness-5',pressure:'gauge',co2:'molecule-co2',
 door:'door',window:'window-closed-variant',motion:'motion-sensor',occupancy:'motion-sensor',smoke:'smoke-detector',moisture:'water-alert',opening:'door-open',presence:'home-account',voltage:'sine-wave',current:'current-ac'};
function icon(s){
  const a=s.attributes||{};
  if(a.icon&&a.icon.startsWith('mdi:'))return a.icon.slice(4);
  return DCICON[a.device_class]||DOMICON[dom(s.entity_id)]||'help-circle-outline';
}
const mdi=n=>`<i class="mdi mdi-${n}"></i>`;

/* ============ Zustand & Verbindung ============ */
let states={},ws,msgId=1,pending={},retry,wantEdit=false,liveCams=new Set(),demoTimer;

function setStatus(k,txt){const e=$('#status');e.className='status '+k;$('#stxt').textContent=txt}
function send(o){return new Promise((res,rej)=>{const id=msgId++;pending[id]={res,rej};ws.send(JSON.stringify({id,...o}))})}
function baseUrl(){let b=cfg.url.trim().replace(/\/$/,'');if(!b&&location.protocol.startsWith('http'))b=location.origin;return b}

function connect(){
  clearTimeout(retry);if(ws){ws.onclose=null;try{ws.close()}catch{}}
  if(cfg.demo){startDemoEngine();return}
  const base=baseUrl();
  if(!base||!cfg.token){setStatus('error','Nicht eingerichtet');renderAll();return}
  setStatus('connecting','Verbinde…');
  try{ws=new WebSocket(base.replace(/^http/,'ws')+'/api/websocket')}catch(e){setStatus('error','Ungültige URL');return}
  let ok=false;
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.type==='auth_required')ws.send(JSON.stringify({type:'auth',access_token:cfg.token}));
    else if(m.type==='auth_ok'){ok=true;setStatus('online','Verbunden');
      send({type:'get_states'}).then(r=>{states={};r.forEach(s=>states[s.entity_id]=s);renderAll()});
      send({type:'subscribe_events',event_type:'state_changed'})}
    else if(m.type==='auth_invalid'){setStatus('error','Token ungültig');ws.onclose=null}
    else if(m.type==='result'){const p=pending[m.id];if(p){delete pending[m.id];m.success?p.res(m.result):p.rej(m.error)}}
    else if(m.type==='event'){const d=m.event.data;d.new_state?states[d.entity_id]=d.new_state:delete states[d.entity_id];updateTile(d.entity_id)}
  };
  ws.onclose=()=>{setStatus('error','Getrennt – neuer Versuch…');retry=setTimeout(connect,ok?2000:6000)};
  ws.onerror=()=>{};
}
function call(domain,service,entity_id,data={}){
  if(cfg.demo)return demoCall(domain,service,entity_id,data);
  if(!ws||ws.readyState!==1)return toast('Nicht verbunden');
  send({type:'call_service',domain,service,target:{entity_id},service_data:data}).catch(e=>toast('Fehler: '+(e.message||'Dienst fehlgeschlagen')));
}

/* ============ Kachel-Rendering ============ */
const num=v=>{const n=parseFloat(v);return isNaN(n)?null:n};
const BIN={door:['Offen','Zu'],window:['Offen','Zu'],opening:['Offen','Zu'],motion:['Bewegung','Ruhig'],occupancy:['Belegt','Frei'],presence:['Anwesend','Abwesend'],smoke:['Rauch!','OK'],moisture:['Feucht!','Trocken'],lock:['Offen','Zu']};
const ALERT_DC=['door','window','opening','smoke','moisture'];

function tile(s){
  const id=s.entity_id,d=dom(id),a=s.attributes||{},st=s.state;
  const name=cfg.names[id]||a.friendly_name||id;
  const unav=st==='unavailable'||st==='unknown';
  let cls='',tg=false,inner='';
  const head=(extra='')=>`<div class="row"><div class="ico">${mdi(icon(s))}</div>${extra}</div>`;
  const label=(t)=>`<div><div class="nm">${esc(name)}</div><div class="st">${t}</div></div>`;

  if(d==='camera'){return{cls:'cam',html:camHTML(s,name)}}

  if(['light','switch','input_boolean','fan'].includes(d)){
    tg=true;const on=st==='on';cls=on?'on':'';
    if(d==='light'&&on&&a.rgb_color)tile.glow=`rgb(${a.rgb_color.join(',')})`;
    const modes=a.supported_color_modes||[];
    const dim=d==='light'&&on&&modes.some(m=>m!=='onoff');
    const pct=a.brightness!=null?Math.round(a.brightness/2.55):0;
    inner=head(`<div class="sw"></div>`)+label(unav?'Nicht verfügbar':on?(d==='light'&&a.brightness!=null?pct+' %':'An'):'Aus')+
      (dim?`<input type="range" min="1" max="100" value="${pct}" data-act="bri" data-id="${id}" onclick="event.stopPropagation()">`:'');
    return{cls:cls+(unav?' off':'')+' tg',html:inner,glow:d==='light'&&on&&a.rgb_color?`rgb(${a.rgb_color.join(',')})`:'',tg:true};
  }
  if(d==='automation'){
    const on=st==='on';
    return{cls:(on?'on':'off')+' tg',tg:true,html:head(`<div class="sw"></div>`)+label(on?'Aktiv':'Deaktiviert')+
      `<button class="rb big" data-act="trig" style="height:32px">${mdi('play')} Ausführen</button>`};
  }
  if(d==='cover'){
    const pos=a.current_position,open=st!=='closed';
    return{cls:open?'on':'',html:head()+label(st==='opening'?'Öffnet…':st==='closing'?'Schließt…':pos!=null?pos+' % offen':(open?'Offen':'Geschlossen'))+
      `<div class="ctl"><button class="rb" data-act="cup">${mdi('arrow-up')}</button><button class="rb" data-act="cstop">${mdi('stop')}</button><button class="rb" data-act="cdn">${mdi('arrow-down')}</button></div>`};
  }
  if(d==='lock'){const lk=st==='locked';return{cls:lk?'on':'',tg:true,glow:lk?'#34d399':'#fbbf24',html:head(`<div class="sw"></div>`)+label(lk?'Verriegelt':'Offen')}}
  if(['scene','script','button'].includes(d)){
    return{cls:'tg',tg:true,html:head(`<span class="rb" style="width:34px;height:34px">${mdi('play')}</span>`)+label(d==='scene'?'Szene aktivieren':d==='script'?'Skript starten':'Drücken')};
  }
  if(d==='climate'){
    const t=a.temperature,cur=a.current_temperature,step=a.target_temp_step||0.5,act=a.hvac_action;
    const on=st!=='off';
    const HV={heat:'Heizen',cool:'Kühlen',idle:'Bereit',off:'Aus',heating:'Heizt',cooling:'Kühlt',auto:'Auto',heat_cool:'Auto',fan_only:'Lüften',dry:'Trocknen'};
    return{cls:on?'on':'',glow:act==='cooling'||st==='cool'?'#38bdf8':'#fb923c',html:head(`<div class="st" style="margin:0">Ist ${cur!=null?cur+'°':'–'}</div>`)+label(HV[act]||HV[st]||st)+
      `<div class="ctl"><button class="rb" data-act="tdn" data-step="${step}">${mdi('minus')}</button><div class="t">${t!=null?t.toFixed(1):'–'}°</div><button class="rb" data-act="tup" data-step="${step}">${mdi('plus')}</button></div>`};
  }
  if(d==='media_player'){
    const pl=st==='playing',idle=['off','unavailable','standby'].includes(st);
    const vol=a.volume_level!=null?Math.round(a.volume_level*100):null;
    return{cls:'mp '+(pl?'on':idle?'off':''),html:head()+`<div class="meta"><div class="nm">${esc(a.media_title||name)}</div><div class="st">${esc(a.media_artist||(pl?'Spielt':idle?'Aus':'Pausiert'))}</div></div>`+
      `<div class="ctl"><button class="rb" data-act="prev">${mdi('skip-previous')}</button><button class="rb big" data-act="pp">${mdi(pl?'pause':'play')}</button><button class="rb" data-act="next">${mdi('skip-next')}</button></div>`+
      (vol!=null&&!idle?`<input type="range" min="0" max="100" value="${vol}" data-act="vol">`:'')};
  }
  if(d==='binary_sensor'){
    const on=st==='on',dc=a.device_class,txt=(BIN[dc]||['An','Aus'])[on?0:1];
    return{cls:'sens'+(on&&ALERT_DC.includes(dc)?' alert':on?' on':''),html:head()+`<div class="val" style="font-size:22px;margin-top:auto">${txt}</div><div class="nm">${esc(name)}</div>`};
  }
  if(d==='person'){const h=st==='home';return{cls:'sens'+(h?' on':''),glow:'#34d399',html:head()+`<div><div class="nm">${esc(name)}</div><div class="st">${h?'Zuhause':st==='not_home'?'Unterwegs':esc(st)}</div></div>`}}
  if(d==='weather'){
    const T={sunny:'Sonnig',cloudy:'Bewölkt',partlycloudy:'Teils bewölkt',rainy:'Regen',pouring:'Starkregen',snowy:'Schnee',fog:'Nebel',lightning:'Gewitter','clear-night':'Klar'};
    return{cls:'sens',html:head()+`<div class="val">${a.temperature??'–'}<small>${a.temperature_unit||'°C'}</small></div><div class="st">${T[st]||st}</div>`};
  }
  // sensor
  const n=num(st),u=a.unit_of_measurement||'';
  return{cls:'sens',html:head()+`<div class="val">${n!==null?(Math.abs(n)>=100?Math.round(n):Math.round(n*10)/10):esc(st)}<small>${esc(u)}</small></div><div class="nm" style="margin-top:-4px">${esc(name)}</div>`};
}

function camHTML(s,name){
  const live=liveCams.has(s.entity_id);
  return `<div class="view"><img data-cam="${s.entity_id}" alt="">
    <div class="ov"></div>
    <div class="top"><span class="rec ${live?'live':''}">${live?'LIVE':'SNAPSHOT'}</span>
      <div class="acts"><button class="rb" data-act="live" title="Live-Stream umschalten">${mdi(live?'pause':'play')}</button><button class="rb" data-act="full" title="Vollbild">${mdi('fullscreen')}</button></div></div>
    <div class="bot"><b>${esc(name)}</b><span style="opacity:.7">${s.state==='unavailable'?'offline':''}</span></div></div>`;
}
function camSrc(id,liveMode){
  const s=states[id];if(!s)return '';
  let p=s.attributes.entity_picture||`/api/camera_proxy/${id}`;
  if(p.startsWith('data:'))return p;
  if(liveMode)p=p.replace('/camera_proxy/','/camera_proxy_stream/');
  return baseUrl()+p+(liveMode?'':(p.includes('?')?'&':'?')+'_t='+Date.now());
}
function refreshCam(img){
  const id=img.dataset.cam;
  if(liveCams.has(id)){const u=camSrc(id,true);if(img.dataset.live!==u.split('?')[0]){img.dataset.live=u.split('?')[0];img.src=u}return}
  img.dataset.live='';
  if(cfg.demo){img.src=demoCam(id);return}
  const n=new Image();n.onload=()=>{img.src=n.src};n.src=camSrc(id,false);
}
setInterval(()=>document.querySelectorAll('img[data-cam]').forEach(refreshCam),3000);

/* ============ Render ============ */
function tileEl(id){
  const s=states[id];
  const el=document.createElement('div');
  el.dataset.id=id;el.draggable=true;
  fillTile(el,s,id);return el;
}
function fillTile(el,s,id){
  if(!s){el.className='tile off';el.innerHTML=`<div class="ico">${mdi('help-circle-outline')}</div><div class="nm">${esc(id)}</div><div class="st">Entität nicht gefunden</div>${edBtns(id)}`;return}
  const t=tile(s);
  el.className='tile '+t.cls;
  el.style.setProperty('--glow',t.glow||'var(--accent)');
  el.innerHTML=t.html+edBtns(id);
  el.querySelectorAll('img[data-cam]').forEach(refreshCam);
}
const edBtns=id=>`<div class="ed"><button class="rn" data-act="ren" title="Umbenennen">${mdi('pencil')}</button><button data-act="del" title="Entfernen">${mdi('close')}</button></div>`;

function renderAll(){
  queueMicrotask(renderPage);
  const m=$('#main');m.innerHTML='';
  if(!cfg.tiles.length){
    m.innerHTML=`<div class="empty"><h3>${mdi('view-dashboard-outline')} Dein Dashboard ist noch leer</h3>
      <p>${Object.keys(states).length?'Füge Kacheln hinzu oder lass dir einen Vorschlag generieren.':'Verbinde dich mit Home Assistant oder starte den Demo-Modus.'}</p>
      ${Object.keys(states).length?`<button class="btn primary" onclick="autoFill()">${mdi('auto-fix')} Automatisch füllen</button><button class="btn" onclick="openPicker()">${mdi('plus')} Kachel wählen</button>`:`<button class="btn primary" onclick="openSettings()">${mdi('lan-connect')} Verbindung einrichten</button><button class="btn" onclick="startDemo()">${mdi('flask-outline')} Demo ansehen</button>`}</div>`;
    summary();return;
  }
  for(const sec of SECTIONS){
    const ids=cfg.tiles.filter(i=>sec.d.includes(dom(i)));
    if(!ids.length)continue;
    const se=document.createElement('section');
    se.innerHTML=`<h2>${mdi(sec.i)} ${sec.t} <em>${ids.length}</em></h2><div class="grid ${sec.grid||''}"></div>`;
    const g=se.querySelector('.grid');ids.forEach(i=>g.appendChild(tileEl(i)));m.appendChild(se);
  }
  summary();
}
function updateTile(id){
  summary();schedPage();
  if(dom(id)==='alarm_control_panel'||dom(id)==='binary_sensor')logAlarm(id);
  const el=document.querySelector(`.tile[data-id="${CSS.escape(id)}"]`);if(!el)return;
  const ae=document.activeElement;
  if(ae&&el.contains(ae)&&ae.type==='range')return;
  if(dom(id)==='camera'){const s=states[id];el.querySelector('.bot span').textContent=s&&s.state==='unavailable'?'offline':'';return}
  fillTile(el,states[id],id);
}

function summary(){
  const all=Object.values(states),cnt=(d,st='on')=>all.filter(s=>dom(s.entity_id)===d&&s.state===st).length;
  const open=all.filter(s=>dom(s.entity_id)==='binary_sensor'&&s.state==='on'&&ALERT_DC.includes(s.attributes.device_class)&&s.attributes.device_class!=='smoke'&&s.attributes.device_class!=='moisture').length;
  const items=[['lightbulb',cnt('light'),'Lichter an'],['home-account',cnt('person','home'),'zuhause'],['door-open',open,'offen'],['robot',cnt('automation'),'Automationen aktiv']];
  $('#chips').innerHTML=Object.keys(states).length?items.map(([i,n,t])=>`<span class="chip">${mdi(i)}<b>${n}</b> ${t}</span>`).join(''):'';
}

/* ============ Interaktion ============ */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');const t=e.target.closest('.tile');
  if(!t)return;
  const id=t.dataset.id,s=states[id],d=dom(id);
  if(b&&b.tagName!=='INPUT'){
    e.stopPropagation();const act=b.dataset.act;
    if(act==='del'){cfg.tiles=cfg.tiles.filter(x=>x!==id);save();renderAll();return}
    if(act==='ren'){const n=prompt('Anzeigename (leer = Original):',cfg.names[id]||s?.attributes.friendly_name||id);if(n!==null){n.trim()?cfg.names[id]=n.trim():delete cfg.names[id];save();fillTile(t,s,id)}return}
    if(document.body.classList.contains('edit'))return;
    const a=s?.attributes||{};
    switch(act){
      case'trig':call('automation','trigger',id);break;
      case'cup':call('cover','open_cover',id);break;case'cdn':call('cover','close_cover',id);break;case'cstop':call('cover','stop_cover',id);break;
      case'tup':case'tdn':{const st=parseFloat(b.dataset.step)||.5;call('climate','set_temperature',id,{temperature:+((a.temperature||20)+(act==='tup'?st:-st)).toFixed(1)});break}
      case'pp':call('media_player','media_play_pause',id);break;case'next':call('media_player','media_next_track',id);break;case'prev':call('media_player','media_previous_track',id);break;

function energyVals(){
  const e=eCfg();let pv=pw('pv'),grid=pw('grid'),batt=pw('batt'),house=pw('house');
  const ids=elist('soc'),caps=String(e.cap||'').split(',').map(x=>+x||0),pids=elist('batt');
  const bats=ids.map((id,i)=>{const s=states[id],ps=pids.length===ids.length?states[pids[i]]:null;let p=ps?num(ps.state):null;if(p!=null)p*=uf(ps);if(p!=null&&e.invBatt)p=-p;
    return{id,soc:s?num(s.state):null,cap:caps[i]||0,p,name:s?.attributes.friendly_name||'Batterie '+(i+1)}});
  const known=bats.filter(b=>b.soc!=null),capTot=bats.reduce((a,b)=>a+b.cap,0);
  let soc=null;if(known.length){const w=known.reduce((a,b)=>a+(b.cap||1),0);soc=known.reduce((a,b)=>a+b.soc*(b.cap||1),0)/w}
  let day=null;elist('pvday').forEach(id=>{const s=states[id];if(!s)return;let n=num(s.state);if(n==null)return;if(s.attributes.unit_of_measurement==='Wh')n/=1000;day=(day||0)+n});
  if(e.invGrid&&grid!=null)grid=-grid;if(e.invBatt&&batt!=null)batt=-batt;
  pv=pv??0;grid=grid??0;batt=batt??0;if(house==null)house=Math.max(0,pv+grid-batt);

  if(!bats.length&&pids.length)bats.push({id:null,soc:null,cap:0,p:batt,name:'Batterie'});
  const cs=bats.reduce((a,b)=>a+(b.cap||1),0);
  const pvids=elist('pv'),unitPv=bats.length>1&&pvids.length===bats.length;
  bats.forEach((b,i)=>{
    if(b.p==null)b.p=batt*(b.cap||1)/cs;
    const ps=unitPv?states[pvids[i]]:null,pn=ps?num(ps.state):null;
    b.pv=unitPv?(pn==null?0:pn*uf(ps)):pv*(b.cap||1)/cs;b.h=b.pv-b.p});
  return{pv,grid,batt,house,soc,day,aut,eig,cap:capTot,bats};
}

function battSvg(fp,nd){

  const Y=330,xN=110,xH=370,xB=630,xP=890,R=72;

  let s=fp('f-grid',`M${xN+R} ${Y}H${xH-R}`,'#38bdf8')+lab('l-grid',(xN+xH)/2,Y-18);
  if(!n){
    s+=fp('f-ph',`M${xB-R} ${Y}H${xH+R}`,'#fbbf24')+lab('l-ph',(xB+xH)/2,Y-18)+nd(xB,Y,'#fbbf24','white-balance-sunny','e-pv','Solar');
  }else{
    const unit=n>1&&elist('pv').length===n;   // Balkonkraftwerke: je Einheit eigene Panels + Batterie
    ys.forEach((y,i)=>{
      const straight=y===Y||unit,ly=y===Y||unit?y-18:(y+Y)/2+(y<Y?-14:26);
      s+=fp('f-pb'+i,unit||y===Y?`M${xP-R} ${y}H${xB+R}`:`M${xP-R} ${Y}C${xP-130} ${Y} ${xP-130} ${y} ${xB+R} ${y}`,'#fbbf24')+lab('l-pb'+i,(xP+xB)/2,ly);
      s+=fp('f-bh'+i,y===Y?`M${xB-R} ${Y}H${xH+R}`:`M${xB-R} ${y}C${xB-130} ${y} ${xB-130} ${Y} ${xH+R} ${Y}`,BCOL[i])+lab('l-bh'+i,(xB+xH)/2,y===Y?Y-18:(y+Y)/2+(y<Y?-14:26));
      if(unit)s+=nd(xP,y,'#fbbf24','white-balance-sunny','e-p'+i,'Solar '+(i+1));
    });
    if(!unit)s+=nd(xP,Y,'#fbbf24','white-balance-sunny','e-pv','Solar');
    ys.forEach((y,i)=>{s+=nd(xB,y,BCOL[i],'battery-high','e-b'+i,n>1?'Batterie '+(i+1):'Batterie')});
  }

}
function flow(id,w,rev){

  const g=$('#'+id+'-pt');g.style.opacity=on?1:0;
  const dur=+Math.max(.9,3.4-w/3000*2.3).toFixed(1),key=''+rev+dur;
  if(on&&g.dataset.k!==key){g.dataset.k=key;g.querySelectorAll('animateMotion').forEach((a,i)=>{a.setAttribute('dur',dur+'s');a.setAttribute('begin',(-i*dur/4)+'s');a.setAttribute('keyPoints',rev?'1;0':'0;1')})}
}

const fh=h=>{if(!isFinite(h)||h>48)return '–';const m=Math.round(h*60);return m>=60?Math.floor(m/60)+' h '+(m%60)+' min':m+' min'};
async function loadEHist(){

  const ids=[...elist('pv'),...elist('house')];if(!ids.length||!ws||ws.readyState!==1)return;
  try{const end=new Date(),start=new Date(end-864e5);
    const r=await send({type:'history/history_during_period',start_time:start.toISOString(),end_time:end.toISOString(),entity_ids:ids,include_start_time_state:true,significant_changes_only:false,minimal_response:true,no_attributes:true});
    eHist={};ids.forEach(id=>eHist[id]=(r[id]||[]).map(x=>[x.lu!=null?x.lu*1000:x.last_updated?Date.parse(x.last_updated):+start,parseFloat(x.s??x.state)*uf(states[id])]).filter(p=>!isNaN(p[1])));
  }catch{}
  drawChart();

function drawChart(tid='e-chart'){
  const el=$('#'+tid);if(!el||!eHist)return;
  const e=eCfg(),t0=Date.now()-864e5,W=800,H=200,L=44,R=10,Tp=10,B=24;
  const buck=pts=>{const n=96,sum=Array(n).fill(0),c=Array(n).fill(0);pts.forEach(([t,v])=>{const i=Math.floor((t-t0)/864e5*n);if(i>=0&&i<n){sum[i]+=v;c[i]++}});
    const out=[];let last=null;for(let i=0;i<n;i++){if(c[i])last=sum[i]/c[i];out.push([t0+(i+.5)*864e5/n,last??0])}return out};
  const comb=ids=>{const ls=ids.filter(i=>eHist[i]).map(i=>buck(eHist[i]));return ls.length?ls[0].map((q,j)=>[q[0],ls.reduce((a,l)=>a+l[j][1],0)]):[]};
  const data=[[elist('pv'),'#fbbf24'],[elist('house'),'#a78bfa']].map(([ids,c])=>({c,p:comb(ids)})).filter(d=>d.p.length);
  const max=Math.max(1000,...data.flatMap(d=>d.p.map(x=>x[1])))*1.1;
  const X=t=>L+(t-t0)/864e5*(W-L-R),Y=v=>Tp+(1-v/max)*(H-Tp-B);
